# Disposable Postgres for the test suite and for browser checks, on port 5434.
#
#   pnpm test:db:up     # start it (waits until it accepts connections)
#   pnpm test:db:down   # stop it and throw the data away
#
# It exists so that nothing automated ever touches the development database
# on 5432. `resetDb()` in tests/helpers/db.ts TRUNCATEs every table it knows
# about, and a browser check drives the real dashboard — either one aimed at
# 5432 destroys whatever a developer had set up there.
#
# `name:` pins the Compose project. Without it, Compose derives the project
# from the directory, this file would share a project with docker-compose.yml,
# and bringing this stack up would *recreate the development container* with
# these settings — the exact accident the file is meant to prevent. The
# service is called `postgres-test` rather than `postgres` for the same
# reason.
name: babellm-test

services:
  postgres-test:
    image: postgres:17-alpine
    # Not `unless-stopped`: this database holds nothing worth resurrecting
    # when Docker restarts.
    restart: "no"
    environment:
      POSTGRES_USER: babellm
      POSTGRES_PASSWORD: babellm
      POSTGRES_DB: babellm_test
      # Postgres refuses a data directory that is group- or world-readable,
      # and a tmpfs mount is created 1777. Pointing PGDATA at a subdirectory
      # lets initdb create that subdirectory itself, with the 0700 it wants.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    # In RAM, so the data cannot outlive the container and cannot accumulate
    # across runs. Also the reason the suite is faster here than on 5432.
    #
    # size=1g, deliberately not raised: TRUNCATE does not reclaim the space
    # partition churn and WAL leave behind, so each full suite run grows this
    # by roughly 40 MB even though every table ends each run empty — a
    # healthy suite eventually fails everywhere with a confusing "no space
    # left on device" from Postgres, via resetDb, that reads like a code
    # defect and is not one. Recycle with `pnpm test:db:down` / `pnpm
    # test:db:up` when that happens; there is roughly two dozen runs between
    # recycles at this size. Do not raise this to buy more runs: tmpfs is
    # RAM-backed, and a cap the Docker VM cannot actually honor does not fail
    # cleanly like this — it swaps and the kernel starts killing containers
    # under memory pressure instead, which is strictly worse to debug. 1g
    # already exceeds what small/constrained hosts have to spare alongside
    # DynamoDB Local's JVM, Redis, and the suite's own Node process; the run
    # ceiling this creates is real and is not a bug to fix here.
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    # Durability buys nothing on a database that dies with the container, and
    # turning it off is the cheapest speedup available to the test suite.
    command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    # `pnpm dev:test-db` uses babellm_dev so that a suite run's TRUNCATE
    # cannot pull state out from under a browser session. Created here
    # because POSTGRES_DB only ever creates one database.
    volumes:
      - ./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babellm -d babellm_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    # Nothing here is worth resurrecting; it dies with the container.
    restart: "no"
    # 6380, not 6379: a developer's own Redis keeps the default port, the way
    # the test Postgres leaves 5432 to theirs.
    ports:
      - "6380:6379"
    # No persistence at all. The usage counters are volatile by design, and a
    # test container that wrote an RDB would be the one place in this repo
    # where they were not.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  dynamodb-test:
    image: amazon/dynamodb-local:2.5.2
    # Nothing here is worth resurrecting; it dies with the container.
    restart: "no"
    # 8001, not 8000: the same courtesy the test Postgres pays 5432 and the
    # test Redis pays 6379.
    ports:
      - "8001:8000"
    # -inMemory is this service's tmpfs: no file is written, so the data
    # cannot outlive the container or accumulate across runs.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-port", "8000"]
    # No healthcheck: the image ships no curl or wget, so `compose --wait`
    # cannot probe it and treats a service without one as ready once it is
    # running. The readiness gap this leaves is closed in
    # tests/helpers/dynamo.ts's createLogsTable(), which retries while the
    # JVM boots.

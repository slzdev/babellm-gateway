services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: babellm
      POSTGRES_PASSWORD: babellm
      POSTGRES_DB: babellm
    ports:
      - "5433:5432"
    volumes:
      - babellm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babellm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  babellm-pg:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: babellm
      POSTGRES_PASSWORD: babellm
      POSTGRES_DB: babellm
    ports:
      - "5432:5432"
    volumes:
      - babellm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # No persistence: the usage counters this holds are volatile by design,
    # and losing them on restart is the same thing that happens when
    # REDIS_URL is unset. Point .env at it with
    # REDIS_URL=redis://localhost:6379.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  babellm-pg:
